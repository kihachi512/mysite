<!DOCTYPE html>
<html>
<head>
    <title>Create Momonga Icon</title>
</head>
<body>
    <canvas id="canvas" width="128" height="128" style="border: 1px solid black;"></canvas>
    <br>
    <button onclick="downloadIcon()">Download PNG</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 背景を透明にする
        ctx.clearRect(0, 0, 128, 128);
        
        // モモンガを描画
        function drawMomonga() {
            // 飛膜（左）
            ctx.fillStyle = '#A0522D';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.moveTo(20, 60);
            ctx.quadraticCurveTo(35, 50, 45, 65);
            ctx.quadraticCurveTo(40, 75, 25, 70);
            ctx.closePath();
            ctx.fill();
            
            // 飛膜（右）
            ctx.beginPath();
            ctx.moveTo(108, 60);
            ctx.quadraticCurveTo(93, 50, 83, 65);
            ctx.quadraticCurveTo(88, 75, 103, 70);
            ctx.closePath();
            ctx.fill();
            
            ctx.globalAlpha = 1.0;
            
            // 体
            ctx.fillStyle = '#8B4513';
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(64, 80, 25, 30, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // お腹
            ctx.fillStyle = '#DEB887';
            ctx.beginPath();
            ctx.ellipse(64, 75, 15, 20, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // 頭
            ctx.fillStyle = '#8B4513';
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(64, 45, 22, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 耳（左）
            ctx.fillStyle = '#8B4513';
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(55, 35, 6, 10, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 耳（右）
            ctx.beginPath();
            ctx.ellipse(73, 35, 6, 10, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 耳の内側（左）
            ctx.fillStyle = '#DEB887';
            ctx.beginPath();
            ctx.ellipse(55, 37, 3, 6, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // 耳の内側（右）
            ctx.beginPath();
            ctx.ellipse(73, 37, 3, 6, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // 目（左）
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(58, 42, 4, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(59, 40, 1.5, 0, 2 * Math.PI);
            ctx.fill();
            
            // 目（右）
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(70, 42, 4, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(71, 40, 1.5, 0, 2 * Math.PI);
            ctx.fill();
            
            // 鼻
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(64, 50, 2, 1.5, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // 口
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(64, 52);
            ctx.quadraticCurveTo(60, 55, 58, 53);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(64, 52);
            ctx.quadraticCurveTo(68, 55, 70, 53);
            ctx.stroke();
            
            // 手（左）
            ctx.fillStyle = '#8B4513';
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(45, 75, 6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 手（右）
            ctx.beginPath();
            ctx.arc(83, 75, 6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 足（左）
            ctx.beginPath();
            ctx.ellipse(55, 105, 6, 8, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 足（右）
            ctx.beginPath();
            ctx.ellipse(73, 105, 6, 8, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 尻尾
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(64, 115, 12, 8, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
            
            // 頬（左）
            ctx.fillStyle = '#CD853F';
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.arc(50, 48, 3, 0, 2 * Math.PI);
            ctx.fill();
            
            // 頬（右）
            ctx.beginPath();
            ctx.arc(78, 48, 3, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.globalAlpha = 1.0;
        }
        
        function downloadIcon() {
            const link = document.createElement('a');
            link.download = 'momonga-icon.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // モモンガを描画
        drawMomonga();
    </script>
</body>
</html>
