<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}｜齊藤智都</title>
  <meta name="description" content="歌人・齊藤智都の短歌連作「{{TITLE}}」全{{COUNT}}首。{{ZINE}}に寄稿した作品を、縦書きで掲載しています。" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="author" content="齊藤智都" />

  <meta property="og:site_name" content="齊藤智都｜歌人" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{TITLE}}｜齊藤智都" />
  <meta property="og:description" content="短歌連作「{{TITLE}}」全{{COUNT}}首。{{ZINE}} 寄稿作品。" />
  <meta property="og:url" content="{{SITE}}/works/{{SLUG}}.html" />
  <meta property="og:image" content="{{SITE}}/works/ogp-{{SLUG}}.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="短歌連作「{{TITLE}}」齊藤智都" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="{{SITE}}/works/{{SLUG}}.html" />

  <link rel="alternate" type="application/rss+xml" title="{{AUTHOR}}｜歌人" href="../feed.xml" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="theme-color" content="#fbfbfa" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Poem",
        "@id": "{{SITE}}/works/{{SLUG}}.html#work",
        "name": "{{TITLE}}",
        "headline": "{{TITLE}}",
        "inLanguage": "ja",
        "genre": "短歌",
        "url": "{{SITE}}/works/{{SLUG}}.html",
        "author": { "@id": "{{SITE}}/#person" },
        "description": "短歌連作「{{TITLE}}」全{{COUNT}}首。"{{ZINE_JSONLD}}
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "齊藤智都", "item": "{{SITE}}/" },
          { "@type": "ListItem", "position": 2, "name": "{{TITLE}}" }
        ]
      }
    ]
  }
  </script>

  <style>
    :root {
      --font: "Poppins", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic",
        "Noto Sans JP", system-ui, sans-serif;

      color-scheme: light dark;
      --paper: #fbfbfa;
      --ink: #14140f;
      --ink-soft: #4a4a44;
      --ink-faint: #8a8a82;
      --rule: rgba(20, 20, 15, 0.14);
      --rule-soft: rgba(20, 20, 15, 0.07);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111110;
        --ink: #eeeee8;
        --ink-soft: #b4b4ac;
        --ink-faint: #83837b;
        --rule: rgba(238, 238, 232, 0.18);
        --rule-soft: rgba(238, 238, 232, 0.09);
      }
    }

    * { box-sizing: border-box; }

    /* 画面いっぱいの三段組み（ヘッダー・本文・フッター）。
       本文が残りの高さをちょうど埋めるので、ページ自体は縦にスクロールしません。 */
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    header.site {
      flex: none;
      border-bottom: 1px solid var(--rule-soft);
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .back {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 2px;
    }

    /* 縦書き本文：一首がかならず一行に収まるよう、画面の高さから字の大きさを決めます */
    .tate {
      flex: 1 1 auto;
      min-height: 0;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      overflow: auto;
      padding: 32px 24px;
      /* 一番長い一首が画面の高さに収まる大きさを、画面の高さから計算します */
      font-size: clamp(12px, calc((100dvh - 200px) / 36), 19px);
      line-height: 1;
      overscroll-behavior: contain;
    }

    @media (min-width: 700px) {
      .tate { padding: 40px 32px; }
    }

    .tate h1 {
      font-size: 1.5em;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin: 0;
      margin-block-end: 1.1em;
      white-space: nowrap;
    }

    /* 作者名は列の下端に揃えます（縦書きでは inline 方向が上下なので end = 下） */
    .byline {
      font-size: 0.85em;
      color: var(--ink-soft);
      letter-spacing: 0.16em;
      margin: 0;
      margin-block-end: 2.6em;
      white-space: nowrap;
      text-align: end;
    }

    .poems p {
      margin: 0;
      margin-block-end: 1.9em;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* 画面が低いときは、一首を一行に収めるほうを優先します */
    @media (max-height: 620px) {
      .tate { padding: 14px 18px; }
      .poems p { letter-spacing: 0; }
      header.site { padding: 10px 18px; }
      footer.site { padding: 10px 18px 14px; }
      .hint { display: none; }
    }

    .tate .colophon {
      font-size: 0.8em;
      color: var(--ink-faint);
      line-height: 1.9;
      margin: 0;
      margin-block-start: 2.4em;
      margin-block-end: 0.5em;
    }

    .works-nav {
      display: flex;
      gap: 8px 20px;
      flex-wrap: wrap;
    }

    footer.site {
      flex: none;
      border-top: 1px solid var(--rule-soft);
      padding: 16px 24px 28px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px 20px;
      flex-wrap: wrap;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
    }

  </style>
</head>
<body>
  <header class="site">
    <a class="back" href="../index.html#works">作品集へもどる</a>
  </header>

  <main class="tate">
    <h1>{{TITLE}}</h1>
    <p class="byline">{{AUTHOR}}</p>
    <div class="poems">
{{COLUMNS}}
    </div>
    <p class="colophon">{{ZINE_SUFFIX}}全{{COUNT_KANJI}}首</p>
  </main>

  <footer class="site">
    <span class="hint">横にスクロールしてお読みください</span>
    <nav class="works-nav"><!-- NAV:START --><!-- NAV:END --></nav>
    {{ZINE_LINK}}
  </footer>

</body>
</html>
