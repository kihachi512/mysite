name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FRONTEND_DIR: old/apps/frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Debug file structure
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -la
        echo "Legacy frontend contents ($FRONTEND_DIR):"
        ls -la "$FRONTEND_DIR"
        echo "package-lock.json exists:"
        ls -la "$FRONTEND_DIR/package-lock.json"
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.FRONTEND_DIR }}/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', env.FRONTEND_DIR)) }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npm ci

    - name: Build application
      working-directory: ${{ env.FRONTEND_DIR }}
      run: npm run build

    - name: Test build
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        ls -la dist/
        echo "Build completed successfully! 🎉"