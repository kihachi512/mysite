name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Amplify と同じく、apps/frontend/public を dist/ にコピーするだけ（依存パッケージなし）
    - name: Build site
      run: npm run build --prefix apps/frontend

    - name: Check output
      run: |
        test -f apps/frontend/dist/index.html
        test -f apps/frontend/dist/404.html
        ls -la apps/frontend/dist/
