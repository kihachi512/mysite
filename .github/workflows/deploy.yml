name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1            # ← S3バケットのリージョンに合わせる
  S3_BUCKET: infrastack-sitebucket397a1860-sscm83yfypju
  DISTRIBUTION_ID: E1OB337O8J6JWH

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build (Next.js)
        run: |
          npm run build
          # out/ が無ければ export も実施
          [ -f out/index.html ] || npx next export

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload non-HTML (long cache)
        run: |
          aws s3 sync ./out "s3://${S3_BUCKET}" --delete --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML (no-cache)
        run: |
          aws s3 cp ./out "s3://${S3_BUCKET}" --recursive --exclude "*" --include "*.html" \
            --cache-control "no-cache" --content-type "text/html" --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"
