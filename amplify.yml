version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Static site build — no dependencies to install"
    build:
      commands:
        - rm -rf dist
        - mkdir -p dist
        - cp index.html dist/index.html
        - cp styles.css dist/styles.css
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
